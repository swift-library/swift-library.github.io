name: Weekly catalog refresh

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate the current catalog and tagged documentation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh workflow run pages.yml --repo "$REPOSITORY" --ref master
