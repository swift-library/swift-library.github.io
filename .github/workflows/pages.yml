name: Pages

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install the workflow validator
        env:
          GOBIN: ${{ github.workspace }}/.build/workflow-tools
          GOMODCACHE: ${{ github.workspace }}/.build/workflow-modules
          GOCACHE: ${{ github.workspace }}/.build/workflow-build
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Check workflow schemas
        run: scripts/check-workflows

  build:
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.6'
      - name: Check pipeline
        run: python3 -m unittest discover -s Tests -v
      - name: Build site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/build-site
      - name: Check site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/check-site
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  result:
    needs: [workflows, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful validation
        env:
          BUILD: ${{ needs.build.result }}
          WORKFLOWS: ${{ needs.workflows.result }}
        run: |
          test "$BUILD" = success
          test "$WORKFLOWS" = success
